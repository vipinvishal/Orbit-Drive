name: Keep backend + database awake

on:
  schedule:
    # Every 10 minutes — safely under Render's 15-min free-tier spin-down
    # window, with margin for GitHub's best-effort cron scheduling.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health/db (wakes Render, queries Supabase)
        run: |
          curl -sf --max-time 30 --retry 2 --retry-delay 5 \
            https://orbit-drive-backend.onrender.com/health/db
